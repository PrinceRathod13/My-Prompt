
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPrompt - Delete Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    main { width: 100%; max-width: 420px; }
    h1, .brand { text-align: center; }
    .brand { color: #2563eb; font-size: 28px; font-weight: bold; margin-bottom: 30px; }
    h1 { font-size: 25px; margin-bottom: 12px; }
    p { color: #64748b; line-height: 1.6; text-align: center; margin-bottom: 25px; }
    label { display: block; font-weight: bold; margin-bottom: 9px; }
    input, button {
      width: 100%; height: 50px; border-radius: 9px; font-size: 15px;
    }
    input { border: 1px solid #cbd5e1; padding: 0 14px; margin-bottom: 18px; }
    button { background: #2563eb; color: white; border: 0; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: .6; }
    #message { display: none; padding: 15px; margin-top: 20px; border-radius: 9px; text-align: center; line-height: 1.5; }
    .error { background: #fef2f2; color: #b91c1c; }
    .success { background: #f0fdf4; color: #15803d; }
  </style>
</head>
<body>
<main>
  <div class="brand">MyPrompt</div>
  <h1>Delete Your Account</h1>
  <p>Enter your registered email address. Follow the secure link sent to your email to permanently delete your account and personal data.</p>

  <form id="form">
    <label for="email">Email Address</label>
    <input id="email" type="email" required placeholder="Enter your registered email">
    <button id="submit" type="submit">Delete Account</button>
  </form>

  <div id="message"></div>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  // REPLACE these values with your Firebase Web App configuration.
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "mypromptapp-dcc07",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("form");
  const emailInput = document.getElementById("email");
  const button = document.getElementById("submit");
  const message = document.getElementById("message");

  const actionCodeSettings = {
    url: window.location.origin + window.location.pathname,
    handleCodeInApp: true
  };

  function showMessage(text, error = false) {
    message.textContent = text;
    message.className = error ? "error" : "success";
    message.style.display = "block";
  }

  // Send secure sign-in link.
  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    button.disabled = true;
    button.textContent = "Sending link...";

    try {
      // Ask backend to confirm that the account exists first.
      const check = await fetch("/api/request-deletion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const checkData = await check.json();
      if (!check.ok || checkData.error) {
        throw new Error(checkData.error || "Unable to process request.");
      }

      await sendSignInLinkToEmail(auth, email, actionCodeSettings);
      localStorage.setItem("mypromptDeletionEmail", email);

      showMessage("A secure sign-in link has been sent. Open it to complete account deletion.");
      form.style.display = "none";
    } catch (error) {
      showMessage(error.message, true);
      button.disabled = false;
      button.textContent = "Delete Account";
    }
  });

  // Complete deletion after the user opens the email link.
  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = localStorage.getItem("mypromptDeletionEmail");

    if (!email) {
      email = window.prompt("Enter the email address where you received the link:");
    }

    if (email) {
      document.querySelector("h1").textContent = "Deleting Account...";
      form.style.display = "none";

      try {
        const result = await signInWithEmailLink(
          auth, email, window.location.href
        );

        const idToken = await result.user.getIdToken(true);

        const response = await fetch("/api/verify-and-delete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Account deletion failed.");
        }

        localStorage.removeItem("mypromptDeletionEmail");
        await auth.signOut();

        document.querySelector("h1").textContent = "Account Deleted";
        showMessage("Your MyPrompt account has been deleted successfully.");
        window.history.replaceState({}, document.title, window.location.pathname);

      } catch (error) {
        document.querySelector("h1").textContent = "Deletion Failed";
        showMessage(error.message, true);
      }
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPrompt Account Deletion</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FFFFFF;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .container { width: 100%; max-width: 440px; margin: 0 auto; }
    .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-logo { width: 40px; height: 40px; object-fit: contain; }
    .brand-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A; }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.25; color: #0F172A; margin-bottom: 12px; letter-spacing: -0.02em; }
    .text { font-size: 15px; line-height: 1.55; color: #475569; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600; color: #334155;
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    input[type="email"] {
      width: 100%; height: 50px; padding: 0 16px; font-size: 15px; color: #0F172A;
      background-color: #FFFFFF; border: 1.5px solid #CBD5E1; border-radius: 10px;
      outline: none; transition: border-color 0.15s ease;
    }
    input[type="email"]:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .btn-blue {
      width: 100%; height: 50px; background-color: #2563EB; color: #FFFFFF;
      font-size: 15px; font-weight: 600; border: none; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background-color 0.15s ease;
    }
    .btn-blue:hover:not(:disabled) { background-color: #1D4ED8; }
    .btn-blue:disabled { background-color: #93C5FD; cursor: not-allowed; }
    .alert {
      display: none; padding: 14px 16px; border-radius: 10px; font-size: 14px;
      line-height: 1.5; margin-bottom: 20px;
    }
    .alert-error { background-color: #FEF2F2; color: #B91C1C; border: 1px solid #FCA5A5; }
    .alert-success { background-color: #F0FDF4; color: #15803D; border: 1px solid #86EFAC; }
    .footer-note { margin-top: 36px; font-size: 12.5px; color: #94A3B8; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="logo.png" alt="MyPrompt Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">MyPrompt</div>
    </div>

    <!-- Global alert (error or success) -->
    <div id="alertBox" class="alert"></div>

    <!-- Form state -->
    <div id="requestState">
      <h1>Delete Your Account</h1>
      <p class="text">
        Enter your registered MyPrompt email address. If the account exists, it will be
        permanently deleted along with all associated personal data.
      </p>

      <form id="deletionForm" novalidate>
        <div class="form-group">
          <label for="emailInput">Registered Email Address</label>
          <input
            type="email"
            id="emailInput"
            name="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
        </div>
        <button type="submit" id="submitBtn" class="btn-blue">
          Delete My Account
        </button>
      </form>
    </div>

    <div class="footer-note">
      MyPrompt &bull; User Privacy & Data Protection
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("deletionForm");
      const emailInput = document.getElementById("emailInput");
      const submitBtn = document.getElementById("submitBtn");
      const alertBox = document.getElementById("alertBox");
      const requestState = document.getElementById("requestState");

      function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
        alertBox.style.display = "block";
      }
      function hideAlert() {
        alertBox.textContent = "";
        alertBox.style.display = "none";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        hideAlert();

        const email = (emailInput.value || "").trim();
        if (!email) {
          showAlert("Please enter your registered email address.", "error");
          emailInput.focus();
          return;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showAlert("Please enter a valid email address.", "error");
          emailInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Deleting Account...";

        try {
          const res = await fetch("/api/delete-account-direct", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.error) {
            throw new Error(data.error || "Failed to delete account. Please try again.");
          }

          // Replace the form with a success message
          requestState.innerHTML =
            '<h1 style="color:#15803D;">Account Deleted</h1>' +
            '<p class="text">' +
            (data.message || "Your account and associated personal data have been permanently deleted.") +
            "</p>";
          showAlert(data.message || "Account deleted successfully.", "success");
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Delete My Account";
          showAlert(err.message || "An unexpected error occurred.", "error");
        }
      });
    })();
  </script>
</body>
</html>
